services:
  - type: web
    name: chougui-quantum-platform-mcp
    runtime: node
    buildCommand: npm ci && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: "1.0.1"
      - key: PUBLIC_SITE_URL
        sync: false
      - key: OPENAI_DOMAIN_VERIFICATION_TOKEN
        sync: false
